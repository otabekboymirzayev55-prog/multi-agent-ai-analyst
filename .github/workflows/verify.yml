name: Verify
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "Desktop/multi agent rag"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt pytest httpx2
      - run: python -m pytest tests/test_api_contract.py tests/test_safe_tools.py tests/test_google_provider.py -q
